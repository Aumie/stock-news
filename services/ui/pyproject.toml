[project]
name = "ui"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "altair>=5.0.0",
    "google-auth>=2.35.0",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
    "httpx>=0.28.1",
    "pandas>=2.0.0",
    "protobuf>=7.36.2",
    "streamlit[auth]>=1.64.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.coverage.run]
omit = ["tests/*", "auth/v1/*"]
