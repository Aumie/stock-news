name: stock-news

services:
  pubsub-emulator:
    # Google's real Pub/Sub emulator — the actual Pub/Sub API/client contract,
    # including real push subscriptions (HTTP POST to a given endpoint), not a
    # stand-in that needs bridging. Replaces an earlier Redis Streams + relay
    # design specifically to avoid needing any bridge at all — Processing's
    # /pubsub/push endpoint is called directly by the emulator, exactly as
    # real Pub/Sub will at the milestone 7 cloud migration (decision_log.md's
    # "Local queue" entry). Uses the JSON config file, not PUBSUB_PROJECT1 env
    # vars — this image's env-var config only supports pull subscriptions.
    image: thekevjames/gcloud-pubsub-emulator:latest
    environment:
      PUBSUBC_CONFIG: /etc/pubsubc/config.json
    volumes:
      - ./infra/pubsub-emulator/config.json:/etc/pubsubc/config.json:ro
    ports:
      - "127.0.0.1:8681:8681"
    depends_on:
      processing:
        condition: service_started

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: stock-news
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  processing:
    build: ./services/processing
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock-news
      LOG_ENV: dev
    depends_on:
      postgres:
        condition: service_healthy

  query-api:
    build: ./services/query-api
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/stock-news
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev-secret-change-me}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      PROCESSING_URL: http://processing:8001
      LOG_ENV: dev
      # Local-dev only (decision_log.md) — selects LocalDockerJobTrigger,
      # which shells out to `docker compose -p stock-news ...`. Matches the
      # `name:` pin at the top of this file. Never set in the cloud image;
      # the milestone 7 migration wires CloudRunJobTrigger there instead.
      COMPOSE_PROJECT_NAME: stock-news
    volumes:
      # Docker socket, local-dev only — lets query-api shell out to start a
      # one-off daily-batch run when a symbol is added (LocalDockerJobTrigger).
      # Socket access is equivalent to host root, so this must never exist in
      # the cloud image/Terraform config — there, query-api instead calls the
      # real GCP Cloud Run Jobs API over HTTPS with IAM auth, no socket needed.
      - /var/run/docker.sock:/var/run/docker.sock
      # `docker compose run` talks to the socket above (the *host's* daemon),
      # so it needs the host's compose file + build context on disk to know
      # what "daily-batch" means — read-only, this container never builds or
      # writes here, only invokes `docker compose run` against it.
      - .:/workspace:ro
    depends_on:
      postgres:
        condition: service_healthy
      processing:
        condition: service_started

  auth:
    build: ./services/auth
    ports:
      # Bound to loopback only, not 0.0.0.0 — this port has no auth of its own
      # (ExchangeIdentity trusts whatever google_sub/email the caller sends;
      # real enforcement is Cloud Run IAM in the target deploy, per api-spec.md).
      # Publishing it to all interfaces would let anyone on the local network
      # mint a valid 24h JWT for any user. The UI container reaches it via the
      # docker-compose network regardless (auth:50051), unaffected by this.
      - "127.0.0.1:50051:50051"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock-news
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  ui:
    build: ./services/ui
    ports:
      - "8501:8501"
    environment:
      AUTH_GRPC_ADDR: auth:50051
      QUERY_API_URL: http://query-api:8002
    volumes:
      # secrets.toml is excluded from the build context (.dockerignore) so real
      # OAuth credentials never end up baked into an image layer — mounted in
      # at runtime instead. Needs services/ui/.streamlit/secrets.toml (copy
      # secrets.toml.example) with real Google OAuth credentials to log in.
      - ./services/ui/.streamlit/secrets.toml:/app/.streamlit/secrets.toml:ro
    depends_on:
      - auth
      - query-api

  poller:
    build: ./services/poller
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/stock-news
      PUBSUB_EMULATOR_HOST: pubsub-emulator:8681
      PUBSUB_PROJECT_ID: stock-news-local
      PUBSUB_TOPIC_ID: articles
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      MARKETAUX_API_KEY: ${MARKETAUX_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      pubsub-emulator:
        condition: service_started

  poller-scheduler:
    # Cloud Scheduler's every-minute HTTP trigger has no free local
    # equivalent, so a plain interval loop stands in for it here
    # (docs/milestone.md §3) — not meant to reflect Cloud Scheduler's own
    # retry/OIDC behavior, just to exercise /trigger repeatedly like it would.
    image: alpine:3.20
    command: >
      sh -c "apk add --no-cache curl >/dev/null && while true; do
        curl -s -o /dev/null -w 'poller trigger: %{http_code}\n' -X POST http://poller:8080/trigger;
        sleep 60;
      done"
    depends_on:
      - poller

  daily-batch:
    # Cloud Run *Job* stand-in (§4.6, §6) — one-shot, not an always-on
    # service, so it's excluded from the default `docker compose up` set via
    # the "batch" profile; run on demand with
    # `docker compose run --rm daily-batch` (matches Cloud Scheduler's
    # once-daily manual-style trigger, not a continuously running container).
    profiles: ["batch"]
    build: ./services/daily-batch
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/stock-news
      DBT_PG_HOST: postgres
      DBT_PG_USER: postgres
      DBT_PG_PASSWORD: postgres
      DBT_PG_DBNAME: stock-news
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
