name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  PYTHON_VERSION: "3.12"

jobs:
  python-tests:
    name: Python tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    # query-api/processing import torch + sentence-transformers at collection
    # time (test_end_to_end.py imports SentenceTransformerEmbedder even
    # though the test itself skips without Postgres) — cold torch import
    # alone measured ~9 minutes locally on first run. 20m gives headroom
    # without letting a genuine hang run to GitHub's 6h default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [query-api, processing, ui, daily-batch]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stock-news
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Apply schema
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d stock-news -f infra/postgres/init.sql
        working-directory: .
        env:
          PGPASSWORD: postgres

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: pytest
        run: uv run python -m pytest -v --cov=. --cov-report=json
        env:
          # daily-batch connects with raw psycopg (main.py itself strips
          # "+psycopg" before calling psycopg.connect() — see its own
          # dbt_env_from_database_url/run_daily_batch), which chokes on the
          # SQLAlchemy-style "+psycopg" driver suffix the other 3 services
          # need. Found live via CI: test_prices_repo.py's own conn fixture
          # passes TEST_DATABASE_URL straight to psycopg.connect(), so it
          # needs the plain form, not the SQLAlchemy form.
          DATABASE_URL: ${{ matrix.service == 'daily-batch' && 'postgresql://postgres:postgres@localhost:5432/stock-news' || 'postgresql+psycopg://postgres:postgres@localhost:5432/stock-news' }}
          TEST_DATABASE_URL: ${{ matrix.service == 'daily-batch' && 'postgresql://postgres:postgres@localhost:5432/stock-news' || 'postgresql+psycopg://postgres:postgres@localhost:5432/stock-news' }}
          JWT_SIGNING_SECRET: ci-test-secret
          ANTHROPIC_API_KEY: ""
          FINNHUB_API_KEY: ""
          MARKETAUX_API_KEY: ""

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.json
          retention-days: 1

  go-tests:
    name: Go tests (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [auth, poller]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: services/${{ matrix.service }}/go.mod
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: gofmt check
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "The following files are not gofmt'd:"
            echo "$fmt_out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (unit)
        run: go test ./internal/... -coverprofile=coverage.out

      - name: Convert coverage to the shared JSON shape
        # go tool cover only reports a percentage, not raw covered/total
        # statement counts — parse the raw profile directly (each line past
        # the "mode:" header is "file:pos numStatements count") so this
        # combines correctly with the Python services' pytest-cov numbers
        # in the aggregation job, weighted by actual statement count rather
        # than averaging two already-averaged percentages.
        run: |
          awk 'NR>1 { total+=$2; if ($3>0) covered+=$2 } END {
            printf "{\"covered_lines\": %d, \"num_statements\": %d}\n", covered, total
          }' coverage.out > coverage.json

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.json
          retention-days: 1

  coverage-badge:
    name: Update coverage badge
    # Only on a real push to main, not PRs — a PR's coverage number isn't
    # "the repo's" coverage until merged, and committing a badge update on
    # every PR run would spam PR branches with noise commits.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python-tests, go-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: coverage-*
          path: coverage-artifacts

      - name: Aggregate coverage, weighted by actual statement count
        # pytest-cov's JSON nests the totals under "totals"; the Go job's
        # JSON (built above) is already flat in the same shape — jq's //
        # falls back to the flat fields when "totals" isn't present, so one
        # expression reads both without reshaping either source.
        run: |
          covered=0
          total=0
          for f in coverage-artifacts/*/coverage.json; do
            c=$(jq '(.totals.covered_lines // .covered_lines)' "$f")
            t=$(jq '(.totals.num_statements // .num_statements)' "$f")
            covered=$((covered + c))
            total=$((total + t))
          done
          pct=$(awk -v c="$covered" -v t="$total" 'BEGIN { printf "%.1f", (c/t)*100 }')
          echo "COVERAGE_PCT=$pct" >> "$GITHUB_ENV"
          echo "covered=$covered total=$total pct=$pct%"

      - name: Write badge JSON
        run: |
          mkdir -p badges
          color=red
          awk -v p="$COVERAGE_PCT" 'BEGIN { exit !(p >= 80) }' && color=brightgreen
          awk -v p="$COVERAGE_PCT" 'BEGIN { exit !(p >= 60 && p < 80) }' && color=yellow
          cat > badges/coverage.json <<EOF
          {
            "schemaVersion": 1,
            "label": "coverage",
            "message": "${COVERAGE_PCT}%",
            "color": "${color}"
          }
          EOF

      - name: Commit badge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/coverage.json
          git diff --staged --quiet && exit 0
          git commit -m "Update coverage badge (${COVERAGE_PCT}%) [skip ci]"
          git push
